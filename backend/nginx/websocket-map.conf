map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ALB が付けたスキームを優先する。無いときだけ nginx 自身のスキームを使う。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $forwarded_proto $fcgi_https {
    https   on;
    default off;
}
